name: Deploy to Production

on:
  # Starts when the CI workflow finishes on main. The job below deploys only
  # if CI succeeded on a push, so a failing build, test or audit blocks it.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual redeploy of main from the Actions tab.
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          NEXT_PUBLIC_APP_URL: https://devscope.vercel.app

      # The Vercel CLI is not a project dependency; pinned to the version the
      # deploy token is known to work with (67.0.0 rejects it).
      - name: Deploy to Vercel (production)
        run: npx --yes vercel@50.41.0 --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
